<p-toast position="bottom-right" />

<section class="groups-card">
  <div class="toolbar">
    <div>
      <h2>Grupos</h2>
      <span>{{ filteredGroups().length }} resultados</span>
    </div>

    <div class="toolbar-actions">
      <span class="search">
        <i class="pi pi-search"></i>
        <input pInputText type="search" placeholder="Buscar grupo..." [ngModel]="search()"
          (ngModelChange)="search.set($event)" />
      </span>
      <button pButton type="button" (click)="openCreate()">
        <i class="pi pi-plus"></i> Nuevo grupo
      </button>
    </div>
  </div>

  <p-table [value]="filteredGroups()" [loading]="loading()" [paginator]="filteredGroups().length > 10" [rows]="10">
    <ng-template #header>
      <tr><th pSortableColumn="nombre">Nombre <p-sort-icon field="nombre" /></th><th pSortableColumn="employee_count">Empleados asignados <p-sort-icon field="employee_count" /></th><th class="actions-column">Acciones</th></tr>
    </ng-template>
    <ng-template #body let-group>
      <tr>
        <td><strong>{{ group.nombre }}</strong></td>
        <td>{{ group.employee_count }}</td>
        <td class="row-actions">
          <button pButton type="button" severity="secondary" [text]="true" [rounded]="true" title="Editar" (click)="openEdit(group)">
            <i class="pi pi-pencil"></i>
          </button>
          <button pButton type="button" severity="danger" [text]="true" [rounded]="true" title="Eliminar" (click)="askDelete(group)">
            <i class="pi pi-trash"></i>
          </button>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="3"><div class="empty"><i class="pi pi-objects-column"></i><strong>No hay grupos</strong><span>No encontramos grupos con la búsqueda actual.</span></div></td></tr>
    </ng-template>
  </p-table>
</section>

<p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)" [modal]="true"
  [draggable]="false" [resizable]="false" [header]="editingId() === null ? 'Nuevo grupo' : 'Editar grupo'"
  [style]="{ width: 'min(460px, calc(100vw - 32px))' }">
  <form (ngSubmit)="save()">
    <label for="group_name">Nombre</label>
    <input pInputText id="group_name" name="group_name" [(ngModel)]="groupName" required />
    <div class="dialog-actions">
      <button pButton type="button" severity="secondary" [outlined]="true" (click)="dialogVisible.set(false)">Cancelar</button>
      <button pButton type="submit" [loading]="saving()">Guardar</button>
    </div>
  </form>
</p-dialog>

<p-dialog [visible]="confirmVisible()" (visibleChange)="confirmVisible.set($event)" [modal]="true"
  [draggable]="false" [resizable]="false" header="Eliminar grupo"
  [style]="{ width: 'min(460px, calc(100vw - 32px))' }">
  <div class="confirm-copy">
    <i class="pi pi-exclamation-triangle"></i>
    <div><strong>¿Eliminar el grupo {{ groupToDelete()?.nombre }}?</strong><p>Los empleados asignados quedarán sin grupo.</p></div>
  </div>
  <div class="dialog-actions">
    <button pButton type="button" severity="secondary" [outlined]="true" (click)="confirmVisible.set(false)">Cancelar</button>
    <button pButton type="button" severity="danger" [loading]="saving()" (click)="delete()">Eliminar</button>
  </div>
</p-dialog>
