<div class="login-page">

  <section class="login-left">
    <img
      src="/template.png"
      alt=""
      class="login-background"
    />

    <div class="logo-container">
      <img
        src="/omega_logo_2.png"
        alt="Omega SM"
        class="logo"
      />
    </div>
  </section>

  <section class="login-right">

    <div class="login-box">

      <header class="login-header">
        <h1>Iniciar sesión</h1>
        <p>Accedé a tu cuenta</p>
      </header>

      <form class="login-form">

        <div class="field">
          <label for="email">
            Email
          </label>

          <input
            pInputText
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="usuario@omegasm.com"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password">
            Contraseña
          </label>

          <div class="password-wrapper">
            <input
              pInputPassword
              id="password"
              name="password"
              [(ngModel)]="password"
              [mask]="!showPassword"
              placeholder="Contraseña"
              autocomplete="current-password"
            />

            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <i
                class="pi"
                [class.pi-eye]="!showPassword"
                [class.pi-eye-slash]="showPassword"
              ></i>
            </button>
          </div>
        </div>

        <div class="login-options">

          <label class="remember">
            <input
              type="checkbox"
              name="remember"
              [(ngModel)]="rememberMe"
            />

            <span class="custom-checkbox"></span>

            <span>
              Recordarme
            </span>
          </label>

          <a
            href="#"
            class="forgot"
          >
            ¿Olvidaste tu contraseña?
          </a>

        </div>

        <button
          pButton
          type="submit"
          class="login-button"
        >
          Ingresar
        </button>

      </form>

    </div>

  </section>

</div>
