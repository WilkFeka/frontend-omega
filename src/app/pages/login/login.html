<div class="login-page">

  <section class="login-left">

    <img
      src="/template.png"
      alt=""
      class="login-background"
    />

    <div class="logo-container">
      <img
        src="/omega_logo_2.png"
        alt="Omega SM"
        class="logo"
      />
    </div>

  </section>

  <section class="login-right">

    <div class="login-box">

      <header class="login-header">
        <h1>Iniciar sesión</h1>
        <p>Accedé a tu cuenta</p>
      </header>

      <form
        class="login-form"
        (ngSubmit)="onSubmit()"
      >

        <div class="field">

          <label for="email">
            Email
          </label>

          <input
            pInputText
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="usuario@omegasm.com"
            autocomplete="email"
            [disabled]="loading()"
          />

        </div>

        <div class="field">

          <label for="password">
            Contraseña
          </label>

          <div class="password-wrapper">

            <input
              pInputPassword
              id="password"
              name="password"
              [(ngModel)]="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Contraseña"
              autocomplete="current-password"
              [disabled]="loading()"
            />

            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [disabled]="loading()"
              [attr.aria-label]="
                showPassword
                  ? 'Ocultar contraseña'
                  : 'Mostrar contraseña'
              "
            >
              <i
                class="pi"
                [class.pi-eye]="!showPassword"
                [class.pi-eye-slash]="showPassword"
              ></i>
            </button>

          </div>

        </div>

        <div class="login-options">

          <label class="remember">

            <input
              type="checkbox"
              name="remember"
              [(ngModel)]="rememberMe"
              [disabled]="loading()"
            />

            <span class="custom-checkbox"></span>

            <span>
              Recordarme
            </span>

          </label>

          <a
            href="#"
            class="forgot"
          >
            ¿Olvidaste tu contraseña?
          </a>

        </div>

        @if (error()) {

          <div class="login-error">

            <i class="pi pi-exclamation-circle"></i>

            <span>
              {{ error() }}
            </span>

          </div>

        }

        <button
          pButton
          type="submit"
          class="login-button"
          [disabled]="loading()"
        >

          @if (loading()) {

            <i class="pi pi-spinner pi-spin"></i>
            Ingresando...

          } @else {

            Ingresar

          }

        </button>

      </form>

    </div>

  </section>

</div>
